name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y lua5.1 libxml2-utils zip

      - name: Lua syntax check
        run: |
          for f in $(find mod -name '*.lua'); do
            luac5.1 -p "$f" && echo "OK $f"
          done

      - name: XML check
        run: xmllint --noout mod/modDesc.xml mod/xml/*.xml

      - name: No debug prints in release code
        run: |
          if grep -nE '^\s*print\(|DEBUG = true' mod/scripts/*.lua; then
            echo "::error::print()/DEBUG=true trouve - interdit dans une version ModHub"
            exit 1
          fi

      - name: Test build warning
        run: |
          if grep -q 'scripts/dev/' mod/modDesc.xml; then
            echo "::warning::Build de TEST (scripts/dev charge) - ne pas publier sur ModHub"
          fi

      - name: Build ZIP
        run: ./tools/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: FS25_farmIconColor
          path: dist/FS25_farmIconColor.zip
